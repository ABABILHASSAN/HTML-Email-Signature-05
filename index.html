<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Signature 5 - Vertical Sidebar</title>
</head>
<body style="margin:0; padding:0; background-color:#e0e0e0; height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif;">

  <!-- Signature Container -->
  <table cellpadding="0" cellspacing="0" role="presentation" style="border:3px solid #4caf50; border-radius:12px; padding:15px; background-color:#ffffff; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-width:500px;">
    <tr>
      <!-- Sidebar Profile Image -->
      <td style="vertical-align:top; padding-right:15px;">
        <img src="profile-image.png" width="80" height="80" style="border-radius:50%; border:3px solid #4caf50;" alt="Ababil Hassan">
      </td>

      <!-- Main Info -->
      <td style="vertical-align:top;">
        <!-- Name & Title -->
        <div style="font-size:18px; font-weight:bold; color:#111;">Ababil Hassan</div>
        <div style="font-size:13px; color:#555; margin-bottom:8px;">Front-End Developer | Email Designer</div>
        
        <!-- Contact Info -->
        <div style="font-size:13px; margin-bottom:4px;">📞 <a href="tel:+8801234567890" style="color:#4caf50; text-decoration:none;">+880 1234-567890</a></div>
        <div style="font-size:13px; margin-bottom:4px;">✉️ <a href="mailto:ababil@email.com" style="color:#4caf50; text-decoration:none;">ababil@email.com</a></div>
        <div style="font-size:13px; margin-bottom:4px;">📍 <span style="color:#555;">Dhaka, Bangladesh</span></div>
        <div style="font-size:13px; margin-bottom:8px;">📅 Available Mon-Fri 9am-6pm</div>
        
        <!-- Social Icons -->
        <div>
          <a href="https://linkedin.com" style="margin:0 4px;"><img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" width="20" height="20" alt="LinkedIn"></a>
          <a href="https://github.com" style="margin:0 4px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733553.png" width="20" height="20" alt="GitHub"></a>
          <a href="https://twitter.com" style="margin:0 4px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" width="20" height="20" alt="Twitter"></a>
        </div>
      </td>
    </tr>
  </table>

</body>
</html>
